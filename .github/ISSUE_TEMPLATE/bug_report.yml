name: Bug report
description: Report an error or unexpected behavior in Land Use Studio
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Land Use Studio. This is a **public issue**. Never include API keys, confidential plans, identifiable client files, or private coordinates.
  - type: dropdown
    id: workspace
    attributes:
      label: Workspace
      options:
        - Land Use Analysis (LUA)
        - GIS to CAD (GTC)
        - Both / General
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Explain the problem you encountered.
      placeholder: The app displayed...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Click...
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: V4.4.3 beta
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox on Windows 11
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Optional non-sensitive logs or screenshots only.
